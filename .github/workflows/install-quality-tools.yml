name: Install quality tools

on:
  pull_request:

permissions:
  contents: write

jobs:
  install:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -D eslint @eslint/js globals typescript-eslint eslint-plugin-react-hooks eslint-plugin-react-refresh prettier
      - run: npm pkg set "scripts.lint=eslint ." "scripts.format=prettier --write ." "scripts.format:check=prettier --check ."
      - name: Commit dependency updates
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependencies are already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: ESLintとPrettierを導入"
          git push origin HEAD:${{ github.head_ref }}
