name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Run focused Battle preview E2E
        if: github.head_ref == 'fix/battle-stable-workspace-v2'
        run: npx playwright test e2e/battle-stable-workspace-v2.spec.ts e2e/battle-item-stock-display.spec.ts
      - name: Run full E2E
        if: github.head_ref != 'fix/battle-stable-workspace-v2'
        run: npm run test:e2e
      - name: Upload Battle workspace v2 screenshots
        if: always() && github.head_ref == 'fix/battle-stable-workspace-v2'
        uses: actions/upload-artifact@v4
        with:
          name: battle-stable-workspace-v2-screenshots
          path: test-results/battle-stable-workspace-v2*/**/*.png
          if-no-files-found: ignore
