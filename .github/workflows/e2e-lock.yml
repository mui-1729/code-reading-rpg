name: Generate Playwright lockfile

on:
  push:
    branches: [test/open-world-e2e]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --save-dev @playwright/test@1.62.1
      - run: rm .github/workflows/e2e-lock.yml
      - name: Commit generated lockfile
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json .github/workflows/e2e-lock.yml
          git commit -m "chore: add Playwright dependency"
          git push
